<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Level 10 — Form elements</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <form id="sample-form">
      <label for="message">Message</label>
      <input type="text" id="message" />
      <label for="email">Email</label>
      <input type="text" id="email" />
      <button type="submit">Submit</button>
    </form>
    <p>
      Form with named inputs. Use 'form.elements' in 'script.js' to read values
      and display them in the DOM or console.
    </p>
    <output id="result">Result placeholder</output>
  </body>
</html>
